<div class="d-flex flex-wrap">
  <div *ngFor="let item of data let id = index " class="p-1 root-hover col-4 col-md-3">
    <div [class.animate]="animatedIndex === id"
         class="card shadow bg-card overflow-hidden text-white">
      <div class="d-flex justify-content-center align-items-center position-absolute m-1 top-0 end-0">
        <button class="my-btn-delete"
                (click)="onBtnClick(id)">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path
              d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
          </svg>
        </button>
      </div>
      <div (click)="onImageClick($event, id)"
           class="img-box card-header p-0 d-flex justify-content-center align-items-center overflow-hidden">
        <div class="d-flex ">
          <img class="rounded-top img-hover"
               height="200"
               alt="..."
               [src]="item.image ? urlImage + item.image : 'assets/img/default.png'"
               (error)="onImageError($event)">
        </div>
      </div>
      <div class="card-body border-top border-3 border-info p-2 overflow-hidden">
        <h5 class="overflow-hidden text-box m-0">{{ item.title }}</h5>
        <p class="overflow-hidden text-secondary m-0 text-box border-top-dashed mt-1 pt-1">
          {{ item.urlSlug }}</p>
      </div>
      <div class="border-bottom border-3 border-info"></div>
    </div>
  </div>
</div>

<div [class.d-none]="isModal" class="modal position-fixed top-40 end-50 d-block" tabIndex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content bg-dark bg-opacity-50 text-white">
      <div class="modal-header border-info bg-card overflow-hidden">
        <h5 class="m-0">Ви дійсно хочете <span class="text-danger">видалити </span> <span
          class="text-info fw-bold me-2">{{ currentTitle }}</span> <i class="text-secondary">{{ currentUrlSlug }}</i>?
        </h5>
      </div>
      <div class="modal-body d-flex justify-content-around">
        <button (click)="openModal()"
                class="btn fw-bolder btn-cancel w-100 me-4 d-flex justify-content-center align-items-center">
          CANCEL
          <svg class="ms-1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
          </svg>
        </button>

        <button (click)="deleteCard()"
                class="btn fw-bolder btn-delete w-100 d-flex justify-content-center align-items-center">
          DELETE
          <svg class="ms-1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
               viewBox="0 0 16 16">
            <path
              d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div [class.blur]="!isModal" class="my-backdrop"></div>

<div (click)="overTakeImageModal($event)" [class.d-none]="isImageModal"
     class="modal position-fixed top-5 end-50 d-block" tabIndex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content bg-dark bg-opacity-50 text-white">
      <div class="modal-header border-info bg-card overflow-hidden">
        <h5 class="m-0"><b class="text-info me-2">{{ currentTitle }}</b> <i
          class="text-secondary">{{ currentUrlSlug }}</i></h5>
      </div>
      <div class="modal-body d-flex justify-content-around">
        <img src='{{currentImageUrl}}' alt="modalImage">
      </div>
      <div class="modal-footer border-info d-flex justify-content-around">
        <button (click)="openImageModal()"
                class="btn fw-bolder btn-cancel w-100 me-4 d-flex justify-content-center align-items-center">
          CANCEL
          <svg class="ms-1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>


<div [class.blur]="!isImageModal" class="my-backdrop"></div>
