<div (click)="overTakeModal($event)" [class.d-none]="isModal"
  class="modal position-fixed top-40 end-50 d-block" tabIndex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content bg-dark bg-opacity-50 text-white">
      <div class="modal-header border-info bg-card overflow-hidden">
        <h5 class="m-0">{{message}}</h5>
      </div>
      <div class="modal-footer border-info d-flex justify-content-around">
        <button (click)="openModal()"
                class="btn fw-bolder btn-cancel w-100 me-4 d-flex justify-content-center align-items-center">
          CANCEL
          <svg class="ms-1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<div [class.blur]="!isModal" class="my-backdrop"></div>
